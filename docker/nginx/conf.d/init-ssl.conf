# ⚠️ IMPORTANTE: Configuración temporal para obtener certificado SSL
# Este archivo se usa SOLO durante la inicialización SSL
# Será reemplazado por production.conf después de obtener el certificado

server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};
    
    # Permitir validación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Respuesta temporal para otras peticiones
    location / {
        return 200 'Inicializando SSL... Por favor espera.\n';
        add_header Content-Type text/plain;
    }
}
