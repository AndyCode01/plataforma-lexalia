services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - ./server/.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lexalia}
      MYSQL_USER: ${DB_USER:-lexalia}
      MYSQL_PASSWORD: ${DB_PASS:-Lexalia2026*$}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lexalia

  api:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      # MERCADOPAGO_TOKEN se toma de server/.env
      
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lexalia

volumes:
  db_data:

networks:
  lexalia:
