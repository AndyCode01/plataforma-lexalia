services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lexalia}
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lexalia

  api:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      # MERCADOPAGO_TOKEN se toma de server/.env
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lexalia

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/www:/var/www/certbot
      - ./docker/nginx/ssl:/etc/letsencrypt
    networks:
      - lexalia

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./docker/nginx/ssl:/etc/letsencrypt
      - ./docker/nginx/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h; certbot renew --webroot -w /var/www/certbot; done"

volumes:
  db_data:

networks:
  lexalia:
