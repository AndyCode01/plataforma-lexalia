services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lexalia}
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lexalia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lexalia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - lexalia
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./docker/nginx/ssl:/etc/letsencrypt:rw
      - ./docker/nginx/www:/var/www/certbot:rw
    entrypoint: /bin/sh -c "certbot renew --quiet --no-eff-email && exit 0"
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  lexalia:
    driver: bridge
